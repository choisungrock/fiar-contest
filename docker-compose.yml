# K-라이스페스타 품평회 시스템의 도커 컨테이너를 관리하는 설정 파일

# 폴더명이 한글이라 프로젝트 이름 자동 생성이 비어버리는 문제 방지용 고정 이름
name: fair-app

services:
  db:
    image: mysql:8.0
    container_name: fair-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fair-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fair-fastapi-backend
    restart: always
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENV=development
      - ADMIN_API_SECRET=${ADMIN_API_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      - db
    networks:
      - fair-network

  admin-web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_ADMIN_API_SECRET=${ADMIN_API_SECRET}
    container_name: fair-admin-web
    restart: always
    ports:
      - "${ADMIN_HOST_PORT}:${WEB_PORT}"
    networks:
      - fair-network

  user-web:
    build:
      context: ./web-user
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: fair-user-web
    restart: always
    ports:
      - "${USER_HOST_PORT}:${WEB_PORT}"
    networks:
      - fair-network


volumes:
  db_data:

networks:
  fair-network:
    driver: bridge
