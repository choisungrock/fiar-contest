# K-라이스페스타 품평회 시스템의 도커 컨테이너를 관리하는 설정 파일

services:
  db:
    image: mysql:8.0
    container_name: fair-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fair-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fair-fastapi-backend
    restart: always
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENV=development
    depends_on:
      - db
    networks:
      - fair-network

volumes:
  db_data:

networks:
  fair-network:
    driver: bridge
