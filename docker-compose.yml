# K-라이스페스타 품평회 시스템의 도커 컨테이너를 관리하는 설정 파일

services:
  db:
    image: mysql:8.0
    container_name: fair-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fair-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fair-fastapi-backend
    restart: always
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENV=development
    depends_on:
      - db
    networks:
      - fair-network

  admin-web:
    image: node:20-alpine
    container_name: fair-admin-web
    restart: always
    working_dir: /app
    ports:
      - "${ADMIN_HOST_PORT}:${WEB_PORT}"
    volumes:
      - ./web-admin:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    networks:
      - fair-network

  user-web:
    image: node:20-alpine
    container_name: fair-user-web
    restart: always
    working_dir: /app
    ports:
      - "${USER_HOST_PORT}:${WEB_PORT}"
    volumes:
      - ./web-user:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    networks:
      - fair-network

volumes:
  db_data:

networks:
  fair-network:
    driver: bridge
