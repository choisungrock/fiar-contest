<!-- 평가자 로그인 페이지 및 메인 렌더링 프론트엔드 진입점 파일 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-라이스페스타 품평회 평가 시스템 - 로그인</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #eef1f6;
      color: #2b3646;
      min-height: 100vh;
      display: flex;
    }

    /* 좌측 비주얼 배너 */
    .banner-side {
      width: 40%;
      min-width: 380px;
      background: linear-gradient(160deg, #1b2a4a 0%, #243a63 100%);
      color: #fff;
      padding: 64px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .banner-sub {
      font-size: 14px;
      letter-spacing: 3px;
      color: #d9b866;
      font-weight: 700;
    }

    .banner-title {
      margin-top: 22px;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.25;
    }

    .banner-desc {
      margin-top: 20px;
      font-size: 17px;
      color: #b9c6df;
      line-height: 1.7;
    }

    .banner-foot {
      font-size: 14px;
      color: #8fa1c4;
      line-height: 1.8;
    }

    /* 우측 입력 폼 */
    .form-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      background: #fff;
    }

    .form-container {
      width: 100%;
      max-width: 580px;
    }

    .form-title {
      font-size: 28px;
      font-weight: 800;
      color: #1b2a4a;
    }

    .form-desc {
      margin-top: 8px;
      font-size: 15px;
      color: #6b7890;
    }

    .input-group {
      margin-top: 32px;
    }

    .input-label {
      font-size: 14px;
      font-weight: 700;
      color: #3a475c;
    }

    .input-control {
      margin-top: 10px;
      width: 100%;
      height: 56px;
      border: 1.5px solid #cbd3e1;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 600;
      color: #1b2a4a;
      background: #fff;
      transition: border-color 0.15s ease;
    }

    .input-control:focus {
      outline: none;
      border-color: #1b2a4a;
    }

    /* 부문 선택 버튼 */
    .buman-section {
      margin-top: 30px;
    }

    .buman-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .buman-label.rice {
      color: #5a7a3f;
    }

    .buman-label.sul {
      color: #2f5488;
    }

    .buman-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-buman {
      padding: 14px 8px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      border: 2px solid #e2e7ef;
      background: #fff;
      color: #3a475c;
      transition: all 0.15s ease;
    }

    .btn-buman:hover {
      border-color: #cbd3e1;
    }

    .btn-buman.active {
      border-color: #1b2a4a;
      background: #1b2a4a;
      color: #fff;
      box-shadow: 0 6px 18px rgba(27, 42, 74, 0.15);
    }

    .btn-buman-title {
      font-size: 20px;
      font-weight: 800;
    }

    .btn-buman-sub {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
    }

    /* 제출 버튼 */
    .btn-submit {
      width: 100%;
      height: 58px;
      background: #c3ccdb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: not-allowed;
      margin-top: 40px;
      transition: all 0.2s ease;
    }

    .btn-submit.active {
      background: #1b2a4a;
      cursor: pointer;
    }

    .btn-submit.active:hover {
      background: #243a63;
      box-shadow: 0 4px 15px rgba(27, 42, 74, 0.2);
    }
  </style>
</head>
<body>

  <!-- 좌측 파트 -->
  <div class="banner-side">
    <div>
      <div class="banner-sub">EXPERT EVALUATION</div>
      <h1 class="banner-title">전문가 품평회<br>평가 시스템</h1>
      <div class="banner-desc">2026 우리쌀·우리술<br>K-라이스페스타 품평회</div>
    </div>
    <div class="banner-foot">
      태블릿 전용 · 블라인드/오픈 테스트<br>
      5단계 척도법 · 120점 만점
    </div>
  </div>

  <!-- 우측 파트 -->
  <div class="form-side">
    <div class="form-container">
      <h2 class="form-title">평가 시작</h2>
      <div class="form-desc">평가자명을 입력하고 담당 부문을 선택하세요.</div>

      <form id="evaluationForm">
        <div class="input-group">
          <label class="input-label">평가자 (심사위원 성명)</label>
          <input type="text" id="judgeName" class="input-control" placeholder="예) 홍길동 심사위원" required>
        </div>

        <div class="buman-section">
          <label class="input-label">담당 부문 선택</label>

          <div class="buman-label rice">쌀가공식품 · 오픈테스트</div>
          <div class="buman-grid">
            <button type="button" class="btn-buman" data-buman="A">
              <div class="btn-buman-title">A</div>
              <div class="btn-buman-sub">조리</div>
            </button>
            <button type="button" class="btn-buman" data-buman="B">
              <div class="btn-buman-title">B</div>
              <div class="btn-buman-sub">비조리</div>
            </button>
            <button type="button" class="btn-buman" data-buman="C">
              <div class="btn-buman-title">C</div>
              <div class="btn-buman-sub">농협</div>
            </button>
          </div>

          <div class="buman-label sul">우리술 · 블라인드</div>
          <div class="buman-grid">
            <button type="button" class="btn-buman" data-buman="ga">
              <div class="btn-buman-title">가</div>
              <div class="btn-buman-sub">저도발효주</div>
            </button>
            <button type="button" class="btn-buman" data-buman="na">
              <div class="btn-buman-title">나</div>
              <div class="btn-buman-sub">고도발효주</div>
            </button>
            <button type="button" class="btn-buman" data-buman="da">
              <div class="btn-buman-title">다</div>
              <div class="btn-buman-sub">약·청주</div>
            </button>
            <button type="button" class="btn-buman" data-buman="ra">
              <div class="btn-buman-title">라</div>
              <div class="btn-buman-sub">증류주</div>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit" disabled>평가 시작하기 →</button>
      </form>
    </div>
  </div>

  <script>
    let selectedBuman = "";
    const bumanButtons = document.querySelectorAll(".btn-buman");
    const judgeNameInput = document.getElementById("judgeName");
    const submitBtn = document.getElementById("submitBtn");

    // 부문 버튼 클릭 핸들러
    bumanButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        bumanButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedBuman = btn.getAttribute("data-buman");
        checkFormValidity();
      });
    });

    // 폼 입력 변화 핸들러
    judgeNameInput.addEventListener("input", checkFormValidity);

    function checkFormValidity() {
      const nameValid = judgeNameInput.value.trim().length > 0;
      const bumanValid = selectedBuman !== "";
      
      if (nameValid && bumanValid) {
        submitBtn.classList.add("active");
        submitBtn.removeAttribute("disabled");
      } else {
        submitBtn.classList.remove("active");
        submitBtn.setAttribute("disabled", "true");
      }
    }

    document.getElementById("evaluationForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const judgeName = judgeNameInput.value.trim();
      
      try {
        // 백엔드 API (api.aaa.com 목적 포트 18000) 호출 검증 테스트
        const response = await fetch("http://localhost:18000/api/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ judgeName, buman: selectedBuman })
        });
        const data = await response.json();
        
        console.log("백엔드 응답 데이터:", data);
        alert(`로그인 성공!\n심사위원: ${data.judgeName}\n부문: ${data.buman}`);
      } catch (err) {
        console.error("API 호출 실패:", err);
        alert("백엔드 API 서버와 연결할 수 없습니다. 콘솔 로그를 확인하세요.");
      }
    });
  </script>
</body>
</html>
